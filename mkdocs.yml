site_name: Цифровая экосистема Музея
site_description: Документы закупки и подготовка предложения
site_url: http://127.0.0.1:8000/
theme:
  name: material
  language: ru
  font: false
  features:
  - navigation.tabs
  - navigation.top
  - search.suggest
  - search.highlight
  - content.code.copy
  - navigation.indexes
  - navigation.path
  - navigation.footer
plugins:
- search:
    lang: ru
markdown_extensions:
- tables
- attr_list
- md_in_html
- toc:
    permalink: true
    toc_depth: 4
extra_css:
- stylesheets/extra.css
